[workspace]
resolver = "2"
members = ["crates/inca-core", "crates/inca"]

[workspace.package]
version = "2.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.32", features = ["serde", "mint"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

# Local patch: draw a Maya-style rotation arc instead of transform-gizmo's
# accumulating sector fill (which becomes opaque after several full turns).
[patch.crates-io]
transform-gizmo = { path = "vendor/transform-gizmo" }
