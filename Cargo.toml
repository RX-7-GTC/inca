[workspace]
resolver = "2"
members = ["crates/inca-core", "crates/inca"]

[workspace.package]
version = "2.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.32", features = ["serde", "mint"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

# Local patches:
# - transform-gizmo: draw a Maya-style rotation arc instead of its accumulating sector fill,
#   and Maya-style scale/translate handles.
# - egui: fixed-width colour-picker number fields so U8/F mode does not resize the row.
[patch.crates-io]
transform-gizmo = { path = "vendor/transform-gizmo" }
egui = { path = "vendor/egui" }
